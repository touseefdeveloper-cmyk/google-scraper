name: Scrape Google Reviews

on:
  schedule:
    - cron: "0 7 * * 1"   # Every Monday at 7:00 AM UTC (before BBB, Angi, Facebook)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scrape_google_reviews.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add google_reviews.json
          git diff --cached --quiet || git commit -m "Update Google reviews data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
